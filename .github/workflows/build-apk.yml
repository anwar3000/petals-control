name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle MQTT.js into the app (works with no internet on the phone)
        run: curl -fsSL https://unpkg.com/mqtt@5/dist/mqtt.min.js -o app/src/main/assets/mqtt.min.js

      - name: Build signed APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Villa21-RoomControl
          path: app/build/outputs/apk/release/*.apk

      - name: Publish as GitHub Release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Villa 21 Room Control v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          body: Download the .apk on your Android phone and tap it to install / update.
